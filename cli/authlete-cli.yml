    command: "go install github.com/authlete/authlete-cli/cmd/authlete@latest"
  - method: binary
    command: "download from https://github.com/authlete/authlete-cli/releases"
authentication:
  precedence: [command-line-flag, environment-variable, os-keychain, config-file]
  flag: "--bearer <token>"
  env: AUTHLETE_BEARER
  keychain: "authlete configure (macOS Keychain / GNOME Keyring / Windows Credential Locker)"
  config_file: "~/.config/authlete/config.yaml"
  note: Uses a Service Access Token or Organization Token as a Bearer credential.
server_selection:
