aid: authlete
name: Authlete
description: >-
  Authlete is an API-first OAuth 2.0 and OpenID Connect backend service that provides a headless
  authorization-server engine. It handles the OAuth/OIDC protocol logic and token management so
  organizations can stand up standards-compliant authorization servers and verifiable-credential
  issuers without building the protocol layer themselves. Authlete separates the Management APIs
  (configure services and clients) from the Runtime APIs (power authorization, token, introspection,
  CIBA, device-flow, federation, and OID4VCI endpoints), and offers managed shared cloud, dedicated
  cloud, and self-managed deployment across US, Japan, Europe, and Brazil regional clusters. It
  supports advanced profiles including FAPI / FAPI 2.0, CIBA, PAR, Grant Management, OpenID
  Federation, Native SSO, and OpenID for Verifiable Credential Issuance, plus regional open-banking
  standards (Brazil Open Banking, Australia CDR). Backed by 500 Global.
