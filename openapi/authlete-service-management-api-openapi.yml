            Accepted values are:


            * `null` or `"1.0-ID1"` → Implementer’s Draft 1.

            * `"1.0"` or `"1.0-Final"` → Final 1.0 specification.


            Choose the value that matches the OID4VCI behaviour your service should expose. See the OID4VCI documentation for details.

            '
